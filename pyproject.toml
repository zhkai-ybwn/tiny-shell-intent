[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tiny-shell-intent"
version = "0.1.0"
description = "Windows local shell command semantic recognition engine PoC"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Developer"}
]
dependencies = [
    "model2vec>=0.10.0",
    "rapidfuzz>=3.0.0",
    "numpy>=1.24.0",
    "psutil>=5.9.0"
]

[project.scripts]
tiny-shell = "cli:main"
